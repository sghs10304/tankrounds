<style>
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden;font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;aspect-ratio:16/9;width:min(100vw,calc(100vh*16/9));background:#000;outline:none;border-radius:8px;box-shadow:0 0 40px rgba(0,0,0,0.8)}
  #p2p-modal{position:fixed;inset:0;background:rgba(4,5,16,0.88);display:none;align-items:center;justify-content:center;z-index:100}
  .modal-box{background:#151833;border:2px solid #4fc3f7;border-radius:20px;padding:32px;width:440px;max-width:90vw;text-align:center;color:#fff;box-shadow:0 15px 50px rgba(0,0,0,0.7)}
  .modal-box h2{margin:0 0 12px;color:#ffd54f;font-size:26px}
  .modal-box p{color:#b8bcd8;font-size:15px;margin:0 0 20px;line-height:1.5}
  .code-display{background:#0b0d1e;border:1px dashed #4fc3f7;border-radius:12px;padding:14px;font-size:28px;font-weight:900;letter-spacing:4px;color:#69f0ae;margin-bottom:18px;user-select:all;cursor:pointer}
  .input-row{display:flex;gap:10px;margin-bottom:16px}
  .input-row input{flex:1;background:#0b0d1e;border:2px solid #394075;border-radius:12px;padding:12px;color:#fff;font-size:20px;text-align:center;text-transform:uppercase;letter-spacing:3px;outline:none}
  .input-row input:focus{border-color:#ff8a65}
  .btn{background:#4fc3f7;color:#05060d;border:none;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:800;cursor:pointer;transition:transform 0.1s}
  .btn:hover:not(:disabled){transform:scale(1.03)}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .btn-orange{background:#ff8a65}
  .btn-gray{background:#394075;color:#fff;margin-top:8px;width:100%}
  .mode-row{display:flex;gap:8px;margin-bottom:16px}
  .mode-btn{flex:1;background:#0b0d1e;color:#b8bcd8;border:2px solid #394075;border-radius:10px;padding:10px 4px;font-weight:800;cursor:pointer}
  .mode-btn.on{border-color:#69f0ae;color:#69f0ae}
  .mode-btn:disabled{cursor:default}
  #p2p-status{font-size:14px;color:#ffd54f;margin-top:10px;min-height:20px;line-height:1.4}
  @supports (height:100dvh){canvas{width:min(100vw,calc(100dvh*16/9))}body{height:100dvh}}
  /* ---------- 모바일 ---------- */
  body.touch{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  body.touch canvas{border-radius:0;box-shadow:none}
  #touch-ui{display:none;position:fixed;inset:0;pointer-events:none;z-index:20}
  body.touch #touch-ui{display:block}
  #touch-ui button{pointer-events:auto;touch-action:none;border:2px solid rgba(255,255,255,0.45);background:rgba(14,18,52,0.55);color:#fff;font-weight:900;font-family:inherit;padding:0}
  #touch-ui button.on{background:rgba(79,195,247,0.75)}
  #touch-ui .hidden{display:none !important}
  .pad{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end}
  .pad.left{left:calc(10px + env(safe-area-inset-left))}
  .pad.right{right:calc(10px + env(safe-area-inset-right))}
  .pad button{width:62px;height:62px;border-radius:18px;font-size:26px}
  .pad .col{display:flex;flex-direction:column;gap:10px}
  .pad #tc-fire{width:84px;height:84px;border-radius:50%;font-size:19px;background:rgba(220,60,40,0.78);border-color:#ffd54f}
  .pad #tc-fire.on{background:#ff9100}
  #tc-info{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom));font-size:12px;font-weight:800;color:#fff;background:rgba(5,6,20,0.65);border-radius:12px;padding:4px 12px;white-space:nowrap}
  #tc-info:empty{display:none}
  #tc-chat{position:absolute;right:calc(8px + env(safe-area-inset-right));top:30%;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  #tc-chat button{width:44px;height:44px;border-radius:14px;font-size:22px}
  #tc-chat-list{display:none;gap:6px;position:absolute;right:52px;top:0}
  #tc-chat-list.open{display:flex}
  #touch-ui #tc-zoom{position:absolute;left:calc(8px + env(safe-area-inset-left));top:calc(30% + 46px);width:38px;height:38px;border-radius:12px;font-size:18px}
  #touch-ui #tc-full{position:absolute;left:calc(8px + env(safe-area-inset-left));top:30%;width:38px;height:38px;border-radius:12px;font-size:18px}
  #rotate-hint{display:none;position:fixed;inset:0;z-index:200;background:#080a1e;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;font-size:20px;font-weight:800;line-height:1.5}
  #rotate-hint span{font-size:64px}
  @media (orientation:portrait) and (pointer:coarse){#rotate-hint{display:flex}}
  @media (max-height:540px){
    #p2p-modal{align-items:flex-start;overflow-y:auto;touch-action:pan-y}
    .modal-box{margin:8px auto;padding:12px 18px}
    .modal-box h2{font-size:18px;margin-bottom:6px}
    .modal-box p{font-size:12px;margin-bottom:8px}
    .code-display{font-size:20px;padding:6px;margin-bottom:8px}
    .mode-row,.input-row{margin-bottom:8px}
    .mode-btn,.btn{padding:7px 10px;font-size:14px}
    .input-row input{padding:6px;font-size:17px;min-width:0}
  }
</style>

<body>
<canvas id="game" width="1600" height="900" tabindex="0" aria-label="탱크 라운즈 게임 화면"></canvas>
<noscript>
  <div style="position:fixed;inset:0;overflow:auto;padding:24px;color:#fff;background:#080a1e">
    <h1>탱크 라운즈 (Tank Rounds)</h1>
    <p>설치 없이 바로 즐기는 무료 턴제 탱크 배틀 게임, 탱크 라운즈. 65종의 카드를 모아 탱크를 강화하고 AI 대전, 로컬·온라인 1:1, 2:2 팀전, 4인 난투로 겨뤄 보세요. PC와 모바일 브라우저 지원.</p>
    <p>이 게임을 플레이하려면 브라우저에서 자바스크립트를 켜 주세요.</p>
  </div>
</noscript>

<!-- 모바일 터치 조작 -->
<div id="touch-ui">
  <button id="tc-full" aria-label="전체 화면">⛶</button>
  <button id="tc-zoom" class="hidden" aria-label="확대 전환">🔍</button>
  <div id="tc-chat" class="hidden"><button id="tc-chat-toggle" aria-label="이모지">💬</button><div id="tc-chat-list"></div></div>
  <div id="tc-controls" class="hidden">
    <div class="pad left"><button id="tc-left" aria-label="왼쪽 이동">◀</button><button id="tc-right" aria-label="오른쪽 이동">▶</button></div>
    <div id="tc-info"></div>
    <div class="pad right">
      <div class="col"><button id="tc-ccw" aria-label="포신 반시계 회전">↺</button><button id="tc-cw" aria-label="포신 시계 회전">↻</button></div>
      <button id="tc-fire">발사</button>
    </div>
  </div>
</div>
<div id="rotate-hint"><span>📱↻</span>휴대폰을 가로로 돌려 주세요</div>

<!-- 온라인 멀티플레이 연결 모달 -->
<div id="p2p-modal">
  <div class="modal-box">
    <h2>🌐 온라인 멀티 대전</h2>
    <div class="mode-row">
      <button class="mode-btn" data-mode="1v1">⚔️ 1:1</button>
      <button class="mode-btn" data-mode="2v2">🛡️ 2:2 팀전</button>
      <button class="mode-btn" data-mode="ffa4">👑 4인 난투</button>
    </div>
    <p>친구에게 방 코드를 알려주거나,<br>친구가 만든 4자리 방 코드를 입력하세요.</p>
    <div id="host-section">
      <div style="font-size:13px;color:#80deea;margin-bottom:6px">내 방 코드 (클릭해서 복사)</div>
      <div class="code-display" id="my-room-code">생성 중...</div>
    </div>
    <div class="input-row">
      <input type="text" id="join-code-input" maxlength="4" placeholder="코드4자리">
      <button class="btn btn-orange" id="btn-join-room">입장하기</button>
    </div>
    <div id="p2p-status">클라우드 중계 서버 연결 대기 중...</div>
    <button class="btn btn-gray" id="btn-close-p2p">취소하고 돌아가기</button>
  </div>
</div>

</body>
